<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emoji Catcher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-container">
    <header class="game-header">
      <h1>Emoji Catcher</h1>
      <div class="stats">
        <div class="stat-box">Score: <span id="score">0</span></div>
        <div class="stat-box">Time: <span id="time">30</span>s</div>
      </div>
    </header>

    <div id="game-area" class="game-area">
      <!-- Player Basket -->
      <div id="basket" class="basket">🧺</div>

      <!-- Game Overlay Screens -->
      <div id="start-screen" class="overlay">
        <h2>Catch the Good Emojis!</h2>
        <p>Use ⬅️ / ➡️ Arrow Keys or Touch/Drag to move.</p>
        <p>Avoid the bombs 💣!</p>
        <button id="start-btn" class="btn">Play Game</button>
      </div>

      <div id="game-over-screen" class="overlay hidden">
        <h2>Game Over!</h2>
        <p>Your Final Score: <span id="final-score">0</span></p>
        <button id="restart-btn" class="btn">Play Again</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
