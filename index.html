<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Emoji Catcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-container">
    <header class="game-header">
      <div class="title-row">
        <h1>Emoji Catcher</h1>
        <button id="mute-btn" class="icon-btn" aria-label="Toggle sound">🔊</button>
      </div>
      <div class="stats">
        <div class="stat">Score <b id="score">0</b> <i id="combo" class="combo">×1</i></div>
        <div class="stat">Best <b id="best">0</b></div>
        <div class="stat">Level <b id="level">1</b></div>
        <div class="stat">Lives <b id="lives">❤️❤️❤️</b></div>
      </div>
    </header>

    <div class="stage">
      <canvas id="game" width="480" height="640" aria-label="Emoji Catcher game"></canvas>
      <div id="overlay" class="overlay">
        <h2 id="ov-title">Catch the good stuff</h2>
        <div id="ov-body">
          <p>Move with ⬅️ ➡️ / A D, or drag and swipe.</p>
          <p>Dodge 💣. Catch ⭐ for 50 points.</p>
          <p>Chain catches to build a score multiplier.</p>
          <p>🧲 magnet · 🐢 slow-mo · 🛡️ shield · ❤️ extra life</p>
        </div>
        <button id="start-btn" class="btn">Play</button>
        <small>P or Esc pauses · M mutes</small>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
